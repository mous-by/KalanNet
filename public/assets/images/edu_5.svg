<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="50%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="fl5" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg5)"/>
  <rect width="1920" height="1080" fill="url(#glow5)"/>
  <rect y="820" width="1920" height="260" fill="url(#fl5)"/>
  <line x1="0" y1="820" x2="1920" y2="820" stroke="#0f766e" stroke-width="3" opacity="0.4"/>

  <!-- Library shelves background -->
  <!-- Left shelf unit -->
  <rect x="20" y="50" width="240" height="780" rx="6" fill="#134e4a" opacity="0.35"/>
  <rect x="20" y="200" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <rect x="20" y="360" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <rect x="20" y="520" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <rect x="20" y="680" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <!-- Books on shelves -->
  <rect x="28" y="60" width="18" height="136" rx="2" fill="#dc2626"/><rect x="48" y="68" width="14" height="128" rx="2" fill="#2563eb"/><rect x="64" y="62" width="20" height="134" rx="2" fill="#d97706"/><rect x="86" y="66" width="15" height="130" rx="2" fill="#7c3aed"/><rect x="103" y="60" width="19" height="136" rx="2" fill="#16a34a"/><rect x="124" y="65" width="16" height="131" rx="2" fill="#dc2626"/><rect x="142" y="60" width="21" height="136" rx="2" fill="#0e7490"/><rect x="165" y="68" width="14" height="128" rx="2" fill="#b45309"/><rect x="181" y="62" width="18" height="134" rx="2" fill="#dc2626"/><rect x="201" y="64" width="22" height="132" rx="2" fill="#4338ca"/>
  <rect x="28" y="218" width="16" height="138" rx="2" fill="#16a34a"/><rect x="46" y="225" width="20" height="131" rx="2" fill="#dc2626"/><rect x="68" y="216" width="14" height="140" rx="2" fill="#2563eb"/><rect x="84" y="222" width="18" height="134" rx="2" fill="#d97706"/><rect x="104" y="218" width="22" height="138" rx="2" fill="#7c3aed"/><rect x="128" y="220" width="15" height="136" rx="2" fill="#0e7490"/><rect x="145" y="216" width="19" height="140" rx="2" fill="#b45309"/><rect x="166" y="222" width="16" height="134" rx="2" fill="#dc2626"/><rect x="184" y="218" width="20" height="138" rx="2" fill="#4338ca"/>

  <!-- Right shelf unit -->
  <rect x="1660" y="50" width="240" height="780" rx="6" fill="#134e4a" opacity="0.35"/>
  <rect x="1660" y="200" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <rect x="1660" y="360" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <rect x="1660" y="520" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <rect x="1660" y="680" width="240" height="10" rx="2" fill="#0f766e" opacity="0.55"/>
  <rect x="1668" y="60" width="18" height="136" rx="2" fill="#7c3aed"/><rect x="1688" y="68" width="14" height="128" rx="2" fill="#dc2626"/><rect x="1704" y="62" width="20" height="134" rx="2" fill="#16a34a"/><rect x="1726" y="66" width="15" height="130" rx="2" fill="#2563eb"/><rect x="1743" y="60" width="19" height="136" rx="2" fill="#d97706"/><rect x="1764" y="65" width="16" height="131" rx="2" fill="#0e7490"/><rect x="1782" y="60" width="21" height="136" rx="2" fill="#b45309"/><rect x="1805" y="68" width="14" height="128" rx="2" fill="#4338ca"/><rect x="1821" y="62" width="18" height="134" rx="2" fill="#dc2626"/><rect x="1841" y="64" width="22" height="132" rx="2" fill="#16a34a"/>

  <!-- LARGE OPEN BOOK (center) -->
  <!-- Book shadow -->
  <ellipse cx="960" cy="720" rx="380" ry="30" fill="#042f2e" opacity="0.4"/>
  <!-- Left page -->
  <path d="M480,200 C480,195 485,190 490,190 L940,200 L940,710 L490,720 C485,720 480,715 480,710 Z" fill="#fef9c3" opacity="0.95"/>
  <!-- Right page -->
  <path d="M980,200 L1430,190 C1435,190 1440,195 1440,200 L1440,710 C1440,715 1435,720 1430,720 L980,710 Z" fill="#fff7ed" opacity="0.95"/>
  <!-- Spine/binding -->
  <rect x="940" y="192" width="42" height="525" rx="4" fill="#92400e" opacity="0.6"/>
  <!-- Book cover bottom -->
  <rect x="478" y="708" width="984" height="24" rx="4" fill="#92400e" opacity="0.5"/>

  <!-- Left page content (text lines) -->
  <text x="520" y="270" font-family="Georgia,serif" font-size="36" fill="#1c1917" opacity="0.8" font-weight="bold">Chapitre 5</text>
  <line x1="520" y1="285" x2="900" y2="285" stroke="#1c1917" stroke-width="2" opacity="0.3"/>
  <rect x="520" y="310" width="360" height="6" rx="3" fill="#1c1917" opacity="0.2"/>
  <rect x="520" y="332" width="400" height="6" rx="3" fill="#1c1917" opacity="0.18"/>
  <rect x="520" y="354" width="340" height="6" rx="3" fill="#1c1917" opacity="0.2"/>
  <rect x="520" y="376" width="380" height="6" rx="3" fill="#1c1917" opacity="0.17"/>
  <rect x="520" y="398" width="360" height="6" rx="3" fill="#1c1917" opacity="0.19"/>
  <rect x="520" y="420" width="400" height="6" rx="3" fill="#1c1917" opacity="0.17"/>
  <rect x="520" y="442" width="280" height="6" rx="3" fill="#1c1917" opacity="0.18"/>
  <!-- Illustration on left page -->
  <circle cx="700" cy="580" r="70" fill="none" stroke="#0f766e" stroke-width="2.5" opacity="0.3"/>
  <path d="M660,555 C680,530 720,530 740,555 C760,580 750,615 730,625 C710,635 680,625 665,605 C648,582 648,567 660,555 Z" fill="#0f766e" opacity="0.12"/>
  <text x="640" y="662" font-family="Georgia,serif" font-size="20" fill="#134e4a" opacity="0.45" font-style="italic">Fig. 5.2</text>
  <rect x="520" y="675" width="360" height="5" rx="2" fill="#1c1917" opacity="0.15"/>

  <!-- Right page content -->
  <rect x="992" y="248" width="400" height="6" rx="3" fill="#1c1917" opacity="0.18"/>
  <rect x="992" y="270" width="380" height="6" rx="3" fill="#1c1917" opacity="0.17"/>
  <rect x="992" y="292" width="420" height="6" rx="3" fill="#1c1917" opacity="0.19"/>
  <rect x="992" y="314" width="350" height="6" rx="3" fill="#1c1917" opacity="0.17"/>
  <rect x="992" y="336" width="400" height="6" rx="3" fill="#1c1917" opacity="0.18"/>
  <rect x="992" y="358" width="360" height="6" rx="3" fill="#1c1917" opacity="0.16"/>
  <!-- Diagram on right page -->
  <rect x="1020" y="400" width="380" height="240" rx="8" fill="#0f766e" opacity="0.08"/>
  <line x1="1020" y1="440" x2="1400" y2="440" stroke="#0f766e" stroke-width="1.5" opacity="0.2"/>
  <line x1="1020" y1="480" x2="1400" y2="480" stroke="#0f766e" stroke-width="1.5" opacity="0.2"/>
  <line x1="1020" y1="520" x2="1400" y2="520" stroke="#0f766e" stroke-width="1.5" opacity="0.2"/>
  <line x1="1020" y1="560" x2="1400" y2="560" stroke="#0f766e" stroke-width="1.5" opacity="0.2"/>
  <line x1="1020" y1="600" x2="1400" y2="600" stroke="#0f766e" stroke-width="1.5" opacity="0.2"/>
  <rect x="992" y="660" width="380" height="5" rx="2" fill="#1c1917" opacity="0.15"/>

  <!-- PAGE NUMBER -->
  <text x="860" y="702" font-family="Georgia,serif" font-size="20" fill="#78350f" opacity="0.5" text-anchor="middle">— 42 —</text>
  <text x="1050" y="702" font-family="Georgia,serif" font-size="20" fill="#78350f" opacity="0.5" text-anchor="middle">— 43 —</text>

  <!-- STUDENT READING (sitting, leaning over book) -->
  <g transform="translate(1580,480)">
    <!-- Chair -->
    <rect x="-50" y="300" width="100" height="12" rx="4" fill="#0f766e" opacity="0.5"/>
    <rect x="-45" y="312" width="10" height="80" rx="3" fill="#0f766e" opacity="0.4"/>
    <rect x="35" y="312" width="10" height="80" rx="3" fill="#0f766e" opacity="0.4"/>
    <!-- Desk (small side table) -->
    <rect x="-80" y="240" width="160" height="12" rx="3" fill="#92400e" opacity="0.55"/>
    <rect x="-72" y="252" width="10" height="55" fill="#78350f" opacity="0.45"/>
    <rect x="62" y="252" width="10" height="55" fill="#78350f" opacity="0.45"/>
    <!-- Book on desk -->
    <rect x="-60" y="220" width="56" height="24" rx="3" fill="#2563eb" opacity="0.6"/>
    <rect x="4" y="222" width="50" height="22" rx="3" fill="#dc2626" opacity="0.55"/>
    <!-- Person (leaning forward, reading) -->
    <!-- Torso leaning forward -->
    <path d="M-35,200 C-40,140 -36,80 -30,50 L30,50 C36,80 40,140 35,200 Z" fill="#1a0a00" transform="rotate(-15,-2,125)"/>
    <!-- Head -->
    <ellipse cx="-42" cy="28" rx="32" ry="36" fill="#1a0a00" transform="rotate(-20,-42,28)"/>
    <ellipse cx="-55" cy="12" rx="34" ry="18" fill="#0f0600" transform="rotate(-20,-42,28)"/>
    <!-- Arms forward on desk -->
    <path d="M-60,160 C-85,190 -90,220 -80,238" stroke="#1a0a00" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M20,165 C45,195 48,225 38,238" stroke="#1a0a00" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="-30" y="295" width="20" height="90" rx="4" fill="#1a0a00"/>
    <rect x="10" y="295" width="20" height="90" rx="4" fill="#1a0a00"/>
    <ellipse cx="-20" cy="390" rx="18" ry="8" fill="#0f0600"/>
    <ellipse cx="20" cy="390" rx="18" ry="8" fill="#0f0600"/>
  </g>

  <!-- Floating book pages/papers (decorative) -->
  <rect x="1680" y="320" width="55" height="70" rx="4" fill="#fef9c3" opacity="0.22" transform="rotate(-18,1707,355)"/>
  <rect x="1750" y="290" width="48" height="62" rx="4" fill="#fff7ed" opacity="0.18" transform="rotate(12,1774,321)"/>
  <rect x="200" y="850" width="55" height="70" rx="4" fill="#fef9c3" opacity="0.16" transform="rotate(8,227,885)"/>
</svg>
