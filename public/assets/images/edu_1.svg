<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="55%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="fl1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#4a1404"/>
    </linearGradient>
    <radialGradient id="wg1" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <rect width="1920" height="200" fill="#b45309" opacity="0.12"/>

  <!-- Floor -->
  <rect y="720" width="1920" height="360" fill="url(#fl1)" opacity="0.55"/>
  <line x1="0" y1="720" x2="1920" y2="720" stroke="#78350f" stroke-width="3" opacity="0.3"/>

  <!-- Floor tiles -->
  <g opacity="0.09" stroke="#78350f" stroke-width="1">
    <line x1="0" y1="780" x2="1920" y2="780"/><line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="900" x2="1920" y2="900"/><line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="0" y1="1020" x2="1920" y2="1020"/>
    <line x1="320" y1="720" x2="320" y2="1080"/><line x1="640" y1="720" x2="640" y2="1080"/>
    <line x1="960" y1="720" x2="960" y2="1080"/><line x1="1280" y1="720" x2="1280" y2="1080"/>
    <line x1="1600" y1="720" x2="1600" y2="1080"/>
  </g>

  <!-- Windows left -->
  <rect x="32" y="80" width="190" height="260" rx="8" fill="#bae6fd" opacity="0.55"/>
  <rect x="32" y="80" width="190" height="260" rx="8" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <line x1="127" y1="80" x2="127" y2="340" stroke="#f59e0b" stroke-width="3.5"/>
  <line x1="32" y1="210" x2="222" y2="210" stroke="#f59e0b" stroke-width="3.5"/>
  <ellipse cx="127" cy="210" rx="220" ry="200" fill="url(#wg1)"/>

  <rect x="32" y="380" width="190" height="250" rx="8" fill="#bae6fd" opacity="0.5"/>
  <rect x="32" y="380" width="190" height="250" rx="8" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <line x1="127" y1="380" x2="127" y2="630" stroke="#f59e0b" stroke-width="3.5"/>
  <line x1="32" y1="505" x2="222" y2="505" stroke="#f59e0b" stroke-width="3.5"/>
  <ellipse cx="127" cy="505" rx="200" ry="180" fill="url(#wg1)" opacity="0.8"/>

  <!-- Light rays from windows -->
  <polygon points="32,80 222,80 750,600 32,600" fill="url(#ray1)"/>

  <!-- Blackboard -->
  <rect x="270" y="55" width="840" height="510" rx="8" fill="#92400e"/>
  <rect x="282" y="67" width="816" height="486" rx="6" fill="#14532d"/>
  <!-- Board text -->
  <text x="380" y="170" font-family="Georgia,serif" font-size="44" fill="#a3e635" opacity="0.88" font-weight="bold">LEÇON DU JOUR</text>
  <line x1="380" y1="185" x2="820" y2="185" stroke="#a3e635" stroke-width="3" opacity="0.7"/>
  <text x="340" y="260" font-family="Georgia,serif" font-size="34" fill="#d9f99d" opacity="0.75">• Les mathématiques</text>
  <text x="340" y="320" font-family="Georgia,serif" font-size="34" fill="#d9f99d" opacity="0.72">• La lecture et l'écriture</text>
  <text x="340" y="380" font-family="Georgia,serif" font-size="34" fill="#d9f99d" opacity="0.7">• Les sciences naturelles</text>
  <text x="370" y="455" font-family="Georgia,serif" font-size="32" fill="#fef9c3" opacity="0.65">2x + 5 = 13  →  x = 4</text>
  <!-- Diagram -->
  <circle cx="890" cy="300" r="75" fill="none" stroke="#d9f99d" stroke-width="2.5" opacity="0.5"/>
  <line x1="890" y1="225" x2="890" y2="375" stroke="#d9f99d" stroke-width="1.5" opacity="0.4"/>
  <line x1="815" y1="300" x2="965" y2="300" stroke="#d9f99d" stroke-width="1.5" opacity="0.4"/>
  <!-- Chalk tray -->
