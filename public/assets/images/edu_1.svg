    <line x1="-42" y1="108" x2="-268" y2="80" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <!-- Other arm -->
    <path d="M42,110 C65,145 70,200 66,235" stroke="#1a0a00" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="-28" y="398" width="20" height="130" rx="4" fill="#1a0a00"/>
    <rect x="8" y="398" width="20" height="130" rx="4" fill="#1a0a00"/>
    <ellipse cx="-18" cy="534" rx="18" ry="8" fill="#0f0600"/>
    <ellipse cx="18" cy="534" rx="18" ry="8" fill="#0f0600"/>
  </g>

