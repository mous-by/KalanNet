  <rect x="420" y="550" width="28" height="8" rx="4" fill="#f8fafc" opacity="0.9"/>
  <rect x="454" y="551" width="20" height="7" rx="3" fill="#fde68a" opacity="0.85"/>
  <rect x="480" y="550" width="25" height="8" rx="4" fill="#f8fafc" opacity="0.8"/>

  <!-- Teacher (right of board, standing) -->
  <g transform="translate(1180,170)">
    <ellipse cx="0" cy="0" rx="36" ry="42" fill="#1a0a00"/>
    <ellipse cx="0" cy="-28" rx="38" ry="20" fill="#0f0600"/>
    <rect x="-13" y="40" width="26" height="20" fill="#1a0a00"/>
    <path d="M-42,60 C-45,200 -40,340 -36,400 L36,400 C40,340 45,200 42,60 Z" fill="#1c1060"/>
    <!-- Pointer toward board -->
