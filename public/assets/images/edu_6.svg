    <line x1="1330" y1="160" x2="1300" y2="160"/><line x1="1550" y1="160" x2="1580" y2="160"/>
    <line x1="1362" y1="82" x2="1340" y2="60"/><line x1="1518" y1="238" x2="1540" y2="260"/>
    <line x1="1362" y1="238" x2="1340" y2="260"/><line x1="1518" y1="82" x2="1540" y2="60"/>
