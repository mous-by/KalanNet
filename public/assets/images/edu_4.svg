<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="55%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="fl4" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e0040" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="sun4" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg4)"/>
