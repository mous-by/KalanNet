  <line x1="0" y1="790" x2="1920" y2="790" stroke="#6d28d9" stroke-width="3" opacity="0.4"/>

  <!-- Sun glow from top-right windows -->
  <rect width="1920" height="1080" fill="url(#sun4)"/>

  <!-- Wall panel line -->
